<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0"/>
<title>TIOL‑Image‑Manager 官方下载</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;font‑family:system‑ui,‑apple‑system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#f7f8fa;color:#1f2937;padding:48px 20px;max‑width:860px;margin:0 auto}
header{text‑align:center;margin‑bottom:48px}
h1{font‑size:38px;margin‑bottom:10px}
.subtitle{color:#6b7280;font‑size:18px;margin‑bottom:24px}
.download‑wrap{display:grid;grid‑template‑columns:1fr 1fr;gap:20px;margin‑bottom:48px}
@media(max‑width:600px){.download‑wrap{grid‑template‑columns:1fr}}
.download‑card{background:#fff;border:1px solid #e5e7eb;border‑radius:12px;padding:32px 28px;text‑align:center}
.download‑card h3{margin‑bottom:14px;font‑size:20px}
.download‑card .file‑info{color:#6b7280;font‑size:15px;margin‑bottom:24px;line‑height:1.5}
.dl‑btn{display:inline‑block;padding:12px 32px;background:#2563eb;color:#fff;text‑decoration:none;border‑radius:8px;font‑weight:600;font‑size:16px}
.dl‑btn:hover{background:#1d4ed8}
.info‑block{background:#fff;border:1px solid #e5e7eb;border‑radius:12px;padding:24px;margin‑bottom:20px}
.info‑block h3{margin‑bottom:12px}
.hash{font‑family:monospace;font‑size:13px;color:#4b5563;word‑break:break‑all;background:#f3f4f6;padding:10px;border‑radius:6px;margin:8px 0}
footer{margin‑top:60px;text‑align:center;color:#9ca3af;font‑size:14px}
.loading{color:#888}
</style>
</head>
<body>
<header>
  <h1>TIOL‑Image‑Manager</h1>
  <p class="subtitle" id="verText"><span class="loading">正在读取版本信息…</span></p>
</header>

<section class="download‑wrap">
  <div class="download‑card">
    <h3>Windows x64 便携版</h3>
    <p class="file‑info" id="winFile">‑</p>
    <a id="winBtn" class="dl‑btn" href="#">下载 Windows</a>
  </div>
  <div class="download‑card">
    <h3>macOS arm64</h3>
    <p class="file‑info" id="macFile">‑</p>
    <a id="macBtn" class="dl‑btn" href="#">下载 macOS</a>
  </div>
</section>

<section class="info‑block">
  <h3>更新日志</h3>
  <div id="releaseBody">
    <p>请查看 <a href="https://github.com/sclass53/TIOL‑Image‑Manager/releases" target="_blank">GitHub Releases</a> 获取完整更新日志。</p>
  </div>
  <br>
  <p>项目仓库：<a href="https://github.com/sclass53/TIOL‑Image‑Manager" target="_blank">github.com/sclass53/TIOL‑Image‑Manager</a></p>
</section>

<footer>
© TIOL‑Image‑Manager | 软件托管于 <a href="https://github.com/MNFilm-Industry/TIOL-site" target="_blank">TIOL-site 仓库</a>
</footer>

<script>
// 基于仓库内部 version.json 和 releases/latest/ 目录
const versionUrl = '/version.json';

// 固定文件名（与 workflow 保持一致）
const WIN_ZIP = 'TIOL-win64-portable.zip';
const MAC_ZIP = 'TIOL-macos-arm64.zip';

async function loadFromRepo() {
  try {
    const res = await fetch(versionUrl);
    if (!res.ok) throw new Error('version.json 加载失败');
    const data = await res.json();

    // 提取版本信息
    const version = data.version || '未知版本';
    const tag = data.tag || 'v' + version;
    const updated = data.updated ? new Date(data.updated).toLocaleDateString('zh-CN') : '';

    // 显示版本号
    document.getElementById('verText').innerText = `${tag} · ${updated}`;

    // 设置下载链接（直接指向 latest 目录）
    const winBtn = document.getElementById('winBtn');
    const macBtn = document.getElementById('macBtn');
    winBtn.href = `/releases/latest/${WIN_ZIP}`;
    winBtn.download = WIN_ZIP;
    macBtn.href = `/releases/latest/${MAC_ZIP}`;
    macBtn.download = MAC_ZIP;

    // 显示文件名（可省略大小）
    document.getElementById('winFile').innerText = WIN_ZIP;
    document.getElementById('macFile').innerText = MAC_ZIP;

    // 注意：version.json 不含 SHA256，此处保留手动占位符
  } catch (err) {
    document.getElementById('verText').innerText = '版本读取失败，请稍后重试';
    console.warn('获取 version.json 失败:', err);
  }
}

loadFromRepo();
</script>
</body>
</html>
