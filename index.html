<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIOL-Image-Manager 下载</title>
    <style>
        /* ---------- 重置 & 基础 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f6f8;
            color: #1e293b;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            flex: 1;
        }

        /* ---------- 头部 ---------- */
        .header {
            text-align: center;
            padding-bottom: 28px;
            border-bottom: 1px solid #e9edf2;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #0b1e3a;
        }

        .header .version {
            margin-top: 6px;
            font-size: 16px;
            color: #6b7a8f;
            font-weight: 400;
        }

        .header .version .loading {
            color: #9aa6b5;
        }

        /* ---------- 下载卡片 (双列) ---------- */
        .download-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 36px;
        }

        .card {
            background: #fafbfc;
            border: 1px solid #e2e7ed;
            border-radius: 12px;
            padding: 28px 20px 24px;
            text-align: center;
            transition: border-color 0.15s;
        }

        .card:hover {
            border-color: #b8c6d8;
        }

        .card h3 {
            font-size: 18px;
            font-weight: 600;
            color: #0f293f;
            margin-bottom: 4px;
        }

        .card .file-name {
            font-size: 13px;
            color: #7a8a9e;
            background: #eef1f5;
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            margin: 6px 0 18px 0;
            font-family: 'SF Mono', 'Fira Code', monospace;
            letter-spacing: 0.2px;
            word-break: break-all;
            max-width: 100%;
        }

        .btn {
            display: inline-block;
            background: #1a5bdb;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 10px 28px;
            border-radius: 8px;
            transition: background 0.15s;
            border: none;
            cursor: pointer;
            min-width: 140px;
        }

        .btn:hover {
            background: #1247b3;
        }

        .btn:active {
            background: #0e3a96;
        }

        /* ---------- 信息区块 ---------- */
        .info-section {
            border-top: 1px solid #e9edf2;
            padding-top: 28px;
            margin-top: 8px;
        }

        .info-section h3 {
            font-size: 17px;
            font-weight: 600;
            color: #0b1e3a;
            margin-bottom: 8px;
        }

        .info-section p {
            font-size: 15px;
            color: #33475b;
            line-height: 1.6;
        }

        .info-section a {
            color: #1a5bdb;
            text-decoration: none;
            font-weight: 500;
        }

        .info-section a:hover {
            text-decoration: underline;
        }

        .info-section .repo-link {
            display: inline-block;
            margin-top: 6px;
        }

        /* ---------- 页脚 ---------- */
        .footer {
            margin-top: 36px;
            text-align: center;
            font-size: 13px;
            color: #8e9daf;
            border-top: 1px solid #e9edf2;
            padding-top: 24px;
            width: 100%;
            max-width: 800px;
        }

        .footer a {
            color: #6b7f94;
            text-decoration: none;
        }

        .footer a:hover {
            color: #1a5bdb;
            text-decoration: underline;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 680px) {
            .container {
                padding: 28px 18px;
            }

            .header h1 {
                font-size: 26px;
            }

            .download-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .card {
                padding: 22px 16px 20px;
            }

            .btn {
                min-width: 120px;
                padding: 10px 20px;
                font-size: 14px;
                width: 100%;
                max-width: 220px;
            }

            .info-section {
                padding-top: 22px;
            }

            .info-section h3 {
                font-size: 16px;
            }

            .info-section p {
                font-size: 14px;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 20px 14px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header .version {
                font-size: 14px;
            }

            .card h3 {
                font-size: 16px;
            }

            .card .file-name {
                font-size: 12px;
            }

            .btn {
                font-size: 13px;
                padding: 9px 16px;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- 主容器 -->
    <div class="container">

        <!-- 头部 -->
        <div class="header">
            <h1>TIOL‑Image‑Manager</h1>
            <div class="version" id="verText">
                <span class="loading">读取版本中…</span>
            </div>
        </div>

        <!-- 下载卡片 -->
        <div class="download-grid">
            <!-- Windows -->
            <div class="card">
                <h3>Windows x64</h3>
                <span class="file-name" id="winFile">—</span>
                <br />
                <a id="winBtn" class="btn" href="#" download>下载</a>
            </div>
            <!-- macOS -->
            <div class="card">
                <h3>macOS arm64</h3>
                <span class="file-name" id="macFile">—</span>
                <br />
                <a id="macBtn" class="btn" href="#" download>下载</a>
            </div>
        </div>

        <!-- 信息 -->
        <div class="info-section">
            <h3>更新日志</h3>
            <p>
                完整更新记录请查看
                <a href="https://github.com/sclass53/TIOL-Image-Manager/releases" target="_blank" rel="noopener">
                    GitHub Releases
                </a>
                。
            </p>
            <p class="repo-link">
                📂 项目仓库：
                <a href="https://github.com/sclass53/TIOL-Image-Manager" target="_blank" rel="noopener">
                    github.com/sclass53/TIOL-Image-Manager
                </a>
            </p>
        </div>

    </div>

    <!-- 页脚 -->
    <div class="footer">
        TIOL‑Image‑Manager &nbsp;·&nbsp;
        托管于
        <a href="https://github.com/MNFilm-Industry/TIOL-site" target="_blank" rel="noopener">
            TIOL‑site 仓库
        </a>
    </div>

    <!-- ===== 脚本 ===== -->
    <script>
        (function() {
            const WIN_ZIP = 'TIOL-win64-portable.zip';
            const MAC_ZIP = 'TIOL-macos-arm64.zip';
            const VERSION_URL = '/version.json';

            const verEl = document.getElementById('verText');
            const winFileEl = document.getElementById('winFile');
            const macFileEl = document.getElementById('macFile');
            const winBtn = document.getElementById('winBtn');
            const macBtn = document.getElementById('macBtn');

            // 设置下载链接
            winBtn.href = '/releases/latest/' + WIN_ZIP;
            winBtn.download = WIN_ZIP;
            macBtn.href = '/releases/latest/' + MAC_ZIP;
            macBtn.download = MAC_ZIP;

            // 显示文件名
            winFileEl.textContent = WIN_ZIP;
            macFileEl.textContent = MAC_ZIP;

            // 加载版本信息
            async function fetchVersion() {
                try {
                    const resp = await fetch(VERSION_URL, { cache: 'no-cache' });
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const data = await resp.json();

                    let label = data.tag || data.version || '未知版本';
                    if (data.updated) {
                        let dateStr = '';
                        try {
                            const d = new Date(data.updated);
                            if (!isNaN(d)) {
                                dateStr = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
                            }
                        } catch (_) { /* ignore */ }
                        if (dateStr) label += ' · ' + dateStr;
                    }
                    verEl.textContent = label;
                } catch (_) {
                    verEl.textContent = '⚠️ 版本加载失败';
                    console.warn('[TIOL] version.json 加载失败');
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', fetchVersion);
            } else {
                fetchVersion();
            }
        })();
    </script>

</body>
</html>
